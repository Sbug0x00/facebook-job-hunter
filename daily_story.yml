name: Tạo Truyện Ma Tự Động

on:
  schedule:
    # Chạy mỗi ngày lúc 7:00 sáng giờ Việt Nam (UTC+7 = 00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Cho phép chạy thủ công khi cần

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Tạo truyện mới
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python src/generate_story.py

      - name: Thông báo nếu lỗi
        if: failure()
        run: echo "❌ Có lỗi xảy ra! Kiểm tra logs bên trên."
