name: Auto Post Horror Story Bot

on:
  schedule:
    - cron: '0 12 * * *' # Chạy lúc 19:00 tối giờ VN hằng ngày
  workflow_dispatch:

jobs:
  run-automation-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-generativeai g4f gspread oauth2client playwright requests
        npx playwright install chromium --with-deps

    - name: Run Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        FB_COOKIES: ${{ secrets.FB_COOKIES }}
      run: python bot.py

    - name: Khoi chay Bot dang bai
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDS_BASE64: ${{ secrets.GOOGLE_CREDS_BASE64 }}
      run: python bot.py
