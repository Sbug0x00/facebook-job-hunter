
name: Auto Post Horror Story Bot

on:
  schedule:
    # 12:00 UTC bằng đúng 19:00 tối theo múi giờ Việt Nam (ICT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Tạo nút bấm để bạn có thể kích hoạt chạy thử thủ công bất cứ lúc nào

jobs:
  run-automation-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Lay ma nguon tu Repository
      uses: actions/checkout@v4

    - name: Cai dat moi truong Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cai dat thu vien va Trinh duyet ngam
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Khoi chay Bot dang bai
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDS_BASE64: ${{ secrets.GOOGLE_CREDS_BASE64 }}
      run: python bot.py
