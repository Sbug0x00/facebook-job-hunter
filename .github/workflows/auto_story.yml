name: Auto Post Horror Story Bot

on:
  schedule:
    # 12:00 UTC bằng đúng 19:00 tối theo múi giờ Việt Nam (ICT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Tạo nút bấm chạy thử thủ công

jobs:
  run-automation-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Lay ma nguon tu Repository
      uses: actions/checkout@v4

    - name: Cai dat moi truong Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Bước bổ sung: Cài đặt Node.js phiên bản LTS mới nhất để xóa cảnh báo Deprecated
    - name: Cai dat Node.js de ho tro Playwright
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Cai dat cac thu vien Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Bước nâng cấp: Cài đặt Chromium kèm theo toàn bộ thư viện hệ thống chống treo ngầm
    - name: Cai dat Trinh duyet ngam va Dependencies
      run: |
        npx playwright install chromium --with-deps

    - name: Khoi chay Bot dang bai
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GOOGLE_CREDS_BASE64: ${{ secrets.GOOGLE_CREDS_BASE64 }}
      run: python bot.py
