name: Auto Post Horror Story Bot

on:
  schedule:
    # 12:00 UTC bằng đúng 19:00 tối theo múi giờ Việt Nam (ICT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Nút bấm chạy thử thủ công

jobs:
  run-automation-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Lay ma nguon tu Repository
      uses: actions/checkout@v4

    - name: Cai dat moi truong Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cai dat Node.js de ho tro Playwright
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: Cai dat cac thu vien Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Cai dat Trinh duyet ngam va Dependencies
      run: |
        npx playwright install chromium --with-deps

    - name: Khoi chay Bot dang bai
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        # Cập nhật truyền 2 biến chữ thuần mới thay cho biến Base64 cũ
        GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
        GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
      run: python bot.py
