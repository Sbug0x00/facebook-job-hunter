name: Auto Post to Facebook

on:
  # Chạy mỗi ngày lúc 7h sáng (giờ Việt Nam)
  schedule:
    - cron: '0 0 * * *'  # UTC 0:00 = 7:00 AM Việt Nam (UTC+7)
  
  # Cho phép trigger thủ công
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run auto-post script
        env:
          FACEBOOK_GROUP_ID: ${{ secrets.FACEBOOK_GROUP_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        run: |
          # Cập nhật config.json với secrets
          python3 << 'EOF'
          import json
          
          with open('config.json', 'r', encoding='utf-8') as f:
              config = json.load(f)
          
          config['facebook']['group_id'] = "${{ secrets.FACEBOOK_GROUP_ID }}"
          config['facebook']['access_token'] = "${{ secrets.FACEBOOK_ACCESS_TOKEN }}"
          
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, ensure_ascii=False, indent=2)
          EOF
          
          # Chạy script
          python3 main.py
