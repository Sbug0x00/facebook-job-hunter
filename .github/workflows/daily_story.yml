name: Tạo Truyện Ma Tự Động

on:
  schedule:
    # 7:00 sáng giờ Việt Nam (UTC+7) = 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cài thư viện
        run: pip install -r requirements.txt

      - name: Tạo truyện mới
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/generate_story.py

      - name: Commit vào repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "TruyenMaBot"
          git add truyen/ hoan-thanh/
          git diff --staged --quiet || git commit -m "📖 $(date +'%d/%m/%Y') - Cập nhật truyện mới"
          git push
